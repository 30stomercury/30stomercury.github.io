---
layout: default
---
<meta http-equiv="Refresh" content="0; url=https://homepages.inf.ed.ac.uk/s2196654/index.html"/>  
<div class="posts">
  <h1 class="site-name"><a href="{{ site.baseurl }}/"><b>{{ site.name }}</b></a></h1>
  <p class="site-description">{{ site.description }}</p>  <br><br>
  
  {% for post in site.posts %}
    <article class="post">
      <h2>{{ page.title }}</h2>
      <h2><a href="{{ site.baseurl }}{{ post.url }}">{{ post.title }}</a></h2>
      <a class="short">
        {{ post.excerpt }}
      </a>
    </article>
  {% endfor %}
</div>
